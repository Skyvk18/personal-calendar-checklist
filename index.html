<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pulse | Calendar, Tasks & Tournament Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>:root { --bg-main: #0f172a; --bg-card: #1e293b; --bg-hover: #334155; --accent: #6366f1; --accent-hover: #4f46e5; --accent-light: rgba(99, 102, 241, 0.15); --text-primary: #f8fafc; --text-secondary: #94a3b8; --border: #334155; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --tourney: #ec4899; --study: #3b82f6; --assignment: #10b981; --radius: 12px; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; } body { background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; } header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; } .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.35rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } nav { display: flex; gap: 0.5rem; background: var(--bg-main); padding: 0.25rem; border-radius: 10px; border: 1px solid var(--border); } .nav-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1.25rem; border-radius: 8px; font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; } .nav-btn:hover { color: var(--text-primary); } .nav-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); } main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 2rem; } .view-section { display: none; } .view-section.active { display: block; animation: fadeIn 0.25s ease-in-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } } .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; } @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } } .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.15); } .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); } .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; } .cal-title { font-size: 1.25rem; font-weight: 600; } .btn-icon { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s; } .btn-icon:hover { background: var(--bg-hover); } .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; } .cal-day-label { text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); padding-bottom: 0.5rem; } .cal-day { background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; min-height: 90px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color 0.2s, transform 0.1s; } .cal-day:hover { border-color: var(--accent); transform: translateY(-2px); } .cal-day.empty { background: transparent; border: none; cursor: default; } .cal-day.today { border-color: var(--accent); background: var(--accent-light); } .cal-date-num { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); } .cal-day.today .cal-date-num { color: var(--accent); font-weight: 700; } .event-chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; } .chip-study { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border-left: 2px solid var(--study); } .chip-assignment { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border-left: 2px solid var(--assignment); } .chip-tournament { background: rgba(236, 72, 153, 0.2); color: #f472b6; border-left: 2px solid var(--tourney); } .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; } label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; } input, select, textarea { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; } input:focus, select:focus, textarea:focus { border-color: var(--accent); } .btn-primary { background: var(--accent); color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s, box-shadow 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; } .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); } .task-list { display: flex; flex-direction: column; gap: 0.75rem; } .task-item { background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; transition: all 0.2s; } .task-item:hover { border-color: var(--bg-hover); } .task-item.completed { opacity: 0.55; } .task-item.completed .task-title { text-decoration: line-through; } .task-left { display: flex; align-items: center; gap: 0.85rem; } .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; } .task-item.completed .checkbox { background: var(--success); border-color: var(--success); } .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; } .badge-study { background: rgba(59, 130, 246, 0.2); color: #93c5fd; } .badge-assignment { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; } .badge-tournament { background: rgba(236, 72, 153, 0.2); color: #f472b6; } .badge-p-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; } .badge-p-med { background: rgba(245, 158, 11, 0.2); color: #fcd34d; } .badge-p-low { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; } .btn-delete { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; padding: 4px; border-radius: 6px; transition: color 0.2s; } .btn-delete:hover { color: var(--danger); } .tourney-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; } .tourney-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; } .tourney-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--tourney), #a855f7); } .tourney-header { display: flex; justify-content: space-between; align-items: flex-start; } .tourney-name { font-size: 1.1rem; font-weight: 600; } .tourney-meta { font-size: 0.85rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.3rem; } .filters { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; } .filter-chip { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-secondary); padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; } .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }</style></head><body><header><div class="brand"><span>⚡</span> Pulse Hub</div><nav><button class="nav-btn active" onclick="switchTab('calendar')">Calendar</button><button class="nav-btn" onclick="switchTab('tasks')">Tasks & Study</button><button class="nav-btn" onclick="switchTab('tournaments')">Tournaments</button></nav></header><main><section id="view-calendar" class="view-section active"><div class="grid-layout"><div><div class="card"><div class="cal-header"><button class="btn-icon" onclick="changeMonth(-1)">❮</button><div class="cal-title" id="cal-month-year">Month Year</div><button class="btn-icon" onclick="changeMonth(1)">❯</button></div><div class="cal-grid" id="cal-grid"></div></div></div><div><div class="card"><div class="card-title">Quick Add Event</div><form id="quick-add-form" onsubmit="handleQuickAdd(event)"><div class="form-group"><label>Title</label><input type="text" id="quick-title" placeholder="e.g. CS101 Exam or Smash Bros Tourney" required></div><div class="form-group"><label>Category</label><select id="quick-cat"><option value="study">Study Session</option><option value="assignment">Assignment</option><option value="tournament">Tournament</option></select></div><div class="form-group"><label>Date</label><input type="date" id="quick-date" required></div><div class="form-group"><label>Priority</label><select id="quick-priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></div><button type="submit" class="btn-primary" style="width:100%;">+ Add to Schedule</button></form></div><div class="card"><div class="card-title">Upcoming Overview</div><div id="upcoming-overview" class="task-list"></div></div></div></div></section><section id="view-tasks" class="view-section"><div class="grid-layout"><div><div class="card"><div class="card-title"><span>Study Sessions & Assignments</span><div class="filters"><span class="filter-chip active" onclick="filterTasks('all', this)">All</span><span class="filter-chip" onclick="filterTasks('study', this)">Study</span><span class="filter-chip" onclick="filterTasks('assignment', this)">Assignments</span></div></div><div id="tasks-container" class="task-list"></div></div></div><div><div class="card"><div class="card-title">New Task / Study Item</div><form id="task-form" onsubmit="handleAddTask(event)"><div class="form-group"><label>Task Title</label><input type="text" id="task-title" placeholder="e.g. Complete Algo Homework" required></div><div class="form-group"><label>Type</label><select id="task-cat"><option value="assignment">Assignment</option><option value="study">Study Session</option></select></div><div class="form-group"><label>Due Date</label><input type="date" id="task-date" required></div><div class="form-group"><label>Priority</label><select id="task-priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></div><button type="submit" class="btn-primary" style="width:100%;">Create Task</button></form></div></div></div></section><section id="view-tournaments" class="view-section"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;"><h2>Tournament & Event Tracker</h2></div><div class="grid-layout"><div style="grid-column: span 2;"><div class="card"><div class="card-title">Register New Tournament</div><form id="tourney-form" onsubmit="handleAddTourney(event)" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;"><div class="form-group"><label>Tournament / Event Name</label><input type="text" id="tourney-name" placeholder="e.g. Apex Regional Cup" required></div><div class="form-group"><label>Game / Game Category</label><input type="text" id="tourney-game" placeholder="e.g. Esports / Chess / Tennis" required></div><div class="form-group"><label>Date</label><input type="date" id="tourney-date" required></div><div class="form-group"><label>Location / Platform</label><input type="text" id="tourney-loc" placeholder="e.g. Online Discord / Student Center" required></div><div style="grid-column: 1 / -1;"><button type="submit" class="btn-primary">+ Add Tournament</button></div></form></div></div></div><div id="tourney-list" class="tourney-grid"></div></section></main><script>let currentDate = new Date(); let currentTaskFilter = 'all'; const defaultData = { events: [ { id: '1', title: 'Calculus III Midterm Study', category: 'study', date: '2026-11-20', priority: 'high', completed: false }, { id: '2', title: 'CS Data Structures Project', category: 'assignment', date: '2026-11-22', priority: 'high', completed: false }, { id: '3', title: 'Winter Invitational Esports Tournament', category: 'tournament', date: '2026-11-25', location: 'Twitch / Discord', game: 'Valorant', priority: 'high', completed: false }, { id: '4', title: 'Physics Lab Report', category: 'assignment', date: '2026-11-28', priority: 'med', completed: true }, { id: '5', title: 'Campus Chess Championship', category: 'tournament', date: '2026-12-02', location: 'Student Union Rm 204', game: 'Chess', priority: 'med', completed: false } ] }; function loadData() { const stored = localStorage.getItem('pulse_data'); if (!stored) { localStorage.setItem('pulse_data', JSON.stringify(defaultData)); return JSON.parse(JSON.stringify(defaultData)); } return JSON.parse(stored); } function saveData(data) { localStorage.setItem('pulse_data', JSON.stringify(data)); render(); } function switchTab(tabName) { document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active')); document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active')); event.target.classList.add('active'); document.getElementById(`view-${tabName}`).classList.add('active'); } function renderCalendar() { const data = loadData(); const year = currentDate.getFullYear(); const month = currentDate.getMonth(); const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]; document.getElementById('cal-month-year').innerText = `${monthNames[month]} ${year}`; const grid = document.getElementById('cal-grid'); grid.innerHTML = ''; ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => { const lbl = document.createElement('div'); lbl.className = 'cal-day-label'; lbl.innerText = d; grid.appendChild(lbl); }); const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate(); for (let i = 0; i < firstDay; i++) { const emptyCell = document.createElement('div'); emptyCell.className = 'cal-day empty'; grid.appendChild(emptyCell); } const todayStr = new Date().toISOString().split('T')[0]; for (let day = 1; day <= daysInMonth; day++) { const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; const dayCell = document.createElement('div'); dayCell.className = `cal-day ${dateStr === todayStr ? 'today' : ''}`; dayCell.innerHTML = `<div class="cal-date-num">${day}</div>`; const dayEvents = data.events.filter(e => e.date === dateStr); dayEvents.forEach(e => { const chip = document.createElement('div'); chip.className = `event-chip chip-${e.category}`; chip.innerText = e.title; dayCell.appendChild(chip); }); dayCell.onclick = () => { document.getElementById('quick-date').value = dateStr; }; grid.appendChild(dayCell); } } function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); } function renderTasks() { const data = loadData(); const container = document.getElementById('tasks-container'); container.innerHTML = ''; let filtered = data.events.filter(e => e.category === 'study' || e.category === 'assignment'); if (currentTaskFilter !== 'all') { filtered = filtered.filter(e => e.category === currentTaskFilter); } if (filtered.length === 0) { container.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding: 2rem;">No tasks found.</div>'; return; } filtered.forEach(t => { const item = document.createElement('div'); item.className = `task-item ${t.completed ? 'completed' : ''}`; item.innerHTML = `<div class="task-left"><div class="checkbox" onclick="toggleComplete('${t.id}')">${t.completed ? '✓' : ''}</div><div><div class="task-title" style="font-weight:500;">${t.title}</div><div style="font-size:0.8rem; color:var(--text-secondary);">Due: ${t.date}</div></div></div><div style="display:flex; align-items:center; gap:0.5rem;"><span class="badge badge-${t.category}">${t.category}</span><span class="badge badge-p-${t.priority}">${t.priority}</span><button class="btn-delete" onclick="deleteItem('${t.id}')">✕</button></div>`; container.appendChild(item); }); } function filterTasks(cat, el) { currentTaskFilter = cat; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); renderTasks(); } function renderTournaments() { const data = loadData(); const container = document.getElementById('tourney-list'); container.innerHTML = ''; const tourneys = data.events.filter(e => e.category === 'tournament'); if (tourneys.length === 0) { container.innerHTML = '<div style="color:var(--text-secondary); grid-column: 1/-1; text-align:center; padding: 2rem;">No upcoming tournaments registered.</div>'; return; } tourneys.forEach(t => { const card = document.createElement('div'); card.className = 'tourney-card'; card.innerHTML = `<div><div class="tourney-header"><div class="tourney-name">${t.title}</div><span class="badge badge-tournament">${t.game || 'Event'}</span></div><div class="tourney-meta" style="margin-top: 0.75rem;"><div>📅 <strong>Date:</strong> ${t.date}</div><div>📍 <strong>Location:</strong> ${t.location || 'N/A'}</div></div></div><div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:0.75rem;"><span style="font-size:0.8rem; color:var(--text-secondary);">Status: Registered</span><button class="btn-delete" onclick="deleteItem('${t.id}')">Delete</button></div>`; container.appendChild(card); }); } function renderUpcomingOverview() { const data = loadData(); const container = document.getElementById('upcoming-overview'); container.innerHTML = ''; const sorted = [...data.events].sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 4); sorted.forEach(e => { const item = document.createElement('div'); item.style.fontSize = '0.85rem'; item.style.display = 'flex'; item.style.justifyContent = 'space-between'; item.style.padding = '0.5rem 0'; item.style.borderBottom = '1px solid var(--border)'; item.innerHTML = `<div><div style="font-weight:500;">${e.title}</div><div style="color:var(--text-secondary); font-size:0.75rem;">${e.date}</div></div><span class="badge badge-${e.category}">${e.category}</span>`; container.appendChild(item); }); } function toggleComplete(id) { const data = loadData(); const target = data.events.find(e => e.id === id); if (target) { target.completed = !target.completed; saveData(data); } } function deleteItem(id) { const data = loadData(); data.events = data.events.filter(e => e.id !== id); saveData(data); } function handleQuickAdd(e) { e.preventDefault(); const data = loadData(); const newItem = { id: Date.now().toString(), title: document.getElementById('quick-title').value, category: document.getElementById('quick-cat').value, date: document.getElementById('quick-date').value, priority: document.getElementById('quick-priority').value, completed: false }; data.events.push(newItem); saveData(data); document.getElementById('quick-add-form').reset(); document.getElementById('quick-date').valueAsDate = new Date(); } function handleAddTask(e) { e.preventDefault(); const data = loadData(); const newItem = { id: Date.now().toString(), title: document.getElementById('task-title').value, category: document.getElementById('task-cat').value, date: document.getElementById('task-date').value, priority: document.getElementById('task-priority').value, completed: false }; data.events.push(newItem); saveData(data); document.getElementById('task-form').reset(); } function handleAddTourney(e) { e.preventDefault(); const data = loadData(); const newItem = { id: Date.now().toString(), title: document.getElementById('tourney-name').value, category: 'tournament', game: document.getElementById('tourney-game').value, date: document.getElementById('tourney-date').value, location: document.getElementById('tourney-loc').value, priority: 'high', completed: false }; data.events.push(newItem); saveData(data); document.getElementById('tourney-form').reset(); } function render() { renderCalendar(); renderTasks(); renderTournaments(); renderUpcomingOverview(); } document.getElementById('quick-date').valueAsDate = new Date(); render();</script></body></html>
